<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同期タイマー ver.2</title>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100vh;
      overflow: hidden; /* スクロールを禁止し一画面に収める */
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 8px 12px;
      background-color: #0a0e21; /* 非常に暗い紺色 */
      color: #e0e6ed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* 右上の管理者・開放バー */
    .admin-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-bottom: 2px;
    }
    .btn-admin {
      background: #1b243b;
      color: #8a99ad;
      border: 1px solid #2d3b59;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-admin.unlocked {
      background: #28a745;
      color: #ffffff;
      border-color: #28a745;
    }
    .btn-free {
      background: #1b243b;
      color: #8a99ad;
      border: 1px solid #2d3b59;
    }
    .btn-free.active {
      background: #17a2b8;
      color: #ffffff;
      border-color: #17a2b8;
    }

    #status {
      font-size: 3rem;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.2;
    }
    
    /* タイマー枠 */
    .timer-box {
      border: 8px solid #253147;
      border-radius: 20px;
      padding: 5px 0;
      margin: 6px 0;
      background-color: #03060d !important; /* 黒に近い超極暗ネイビー */
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      width: 98vw;
      max-width: 98vw;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      overflow: hidden;
    }

    #timer {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      font-size: clamp(10rem, 40vw, 29rem);
      font-weight: 2000;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: #ffffff !important;
      letter-spacing: 0.02em;
    }

    /* --------------------------------------------------
       点滅アニメーション設定
    -------------------------------------------------- */
    body.warning .timer-box {
      animation: blink-warning-border 2s steps(1) infinite;
    }

    @keyframes blink-warning-border {
      0% { border-color: #253147; }
      50% { border-color: #ff9800; }
    }

    body.danger .timer-box {
      animation: blink-danger-border 0.4s steps(1) infinite;
    }

    @keyframes blink-danger-border {
      0% { border-color: #ff3333; }
      50% { border-color: #1a0000; }
    }

    body.pause-animation.warning .timer-box {
      animation: none !important;
      border-color: #ff9800 !important;
    }

    body.pause-animation.danger .timer-box {
      animation: none !important;
      border-color: #ff3333 !important;
    }

    body.interval .timer-box {
      border-color: #4A5568 !important;
      animation: none;
    }
    body.interval #timer {
      font-size: clamp(4.5rem, 15vw, 9rem);
      color: #888888 !important;
    }

    /* --------------------------------------------------
       入力・操作エリア（極暗ネイビー基調）
    -------------------------------------------------- */
    .input-card {
      display: none; /* ロック中は非表示 */
      background: #131a2c;
      border: 1px solid #253147;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 900px;
      color: #e0e6ed;
      margin-bottom: 4px;
    }

    /* 管理者モード時または開放モード時に入力カードを表示 */
    body.admin-mode .input-card,
    body.free-mode .input-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
    }
    
    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .input-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.95rem;
      font-weight: bold;
      white-space: nowrap;
    }
    
    .input-item input {
      width: 55px;
      padding: 4px 2px;
      font-size: 1rem;
      text-align: center;
      background: #1b243b;
      color: #ffffff;
      border: 1px solid #2d3b59;
      border-radius: 6px;
    }

    /* ボタン群 */
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .btn {
      font-size: 0.95rem;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.96);
    }

    .btn-save {
      background: #17a2b8;
    }

    .btn-start {
      background: #28a745;
    }

    .btn-pause {
      background: #d39e00;
      color: #ffffff;
    }

    .btn-skip {
      background: #0069d9;
    }

    .btn-stop {
      background: #dc3545;
    }

    .btn:disabled {
      background: #1b243b !important;
      color: #4f5d75 !important;
      cursor: not-allowed !important;
      transform: none !important;
      opacity: 0.5;
    }

    /* トースト通知 */
    .toast-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(23, 162, 184, 0.95);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .toast-notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* パスワード入力用 モーダルスタイル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 6, 13, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #131a2c;
      border: 1px solid #253147;
      padding: 20px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      width: 90%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
    }
    .modal-input {
      width: 100%;
      padding: 8px;
      font-size: 1.1rem;
      text-align: center;
      background: #1b243b;
      color: #fff;
      border: 1px solid #2d3b59;
      border-radius: 6px;
    }
    .modal-input.error {
      border-color: #dc3545;
      box-shadow: 0 0 8px rgba(220, 53, 69, 0.5);
    }
    .error-msg {
      color: #dc3545;
      font-size: 0.85rem;
      display: none;
    }
    .error-msg.active {
      display: block;
    }
    .modal-btn-group {
      display: flex;
      gap: 8px;
    }
    .modal-btn {
      flex: 1;
      padding: 8px;
      font-size: 0.95rem;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-btn-cancel {
      background: #253147;
      color: #8a99ad;
    }
    .modal-btn-submit {
      background: #28a745;
      color: white;
    }
  </style>
</head>
<body>

  <!-- 保存完了トースト通知 -->
  <div id="toast" class="toast-notification">設定した時間を保存しました</div>

  <div class="admin-bar">
    <button type="button" id="btn-free-toggle" class="btn-admin btn-free" onclick="handleFreeButtonClick()">🔓 操作開放: OFF</button>
    <button type="button" id="btn-admin-toggle" class="btn-admin" onclick="handleAdminButtonClick()">🔒 管理者</button>
  </div>

  <div>
    <div id="status">準備中</div>
  </div>

  <div class="timer-box">
    <div id="timer">00:00</div>
  </div>

  <!-- 操作パネル -->
  <div class="input-card">
    <div class="input-group">
      <div class="input-item">
        <label for="part1-min">演奏</label>
        <input type="number" id="part1-min" value="0.5" min="0" step="0.1">分
      </div>
      <div class="input-item">
        <label for="part2-min">転換</label>
        <input type="number" id="part2-min" value="0.2" min="0" step="0.1">分
      </div>
    </div>
    
    <div class="btn-group">
      <button type="button" id="btn-save" class="btn btn-save" onclick="saveTimerSettings()">保存</button>
      <button type="button" id="btn-start" class="btn btn-start" onclick="startTimer()">開始</button>
      <button type="button" id="btn-pause" class="btn btn-pause" onclick="togglePause()" disabled>一時停止</button>
      <button type="button" id="btn-skip" class="btn btn-skip" onclick="skipPart()" disabled>スキップ</button>
      <button type="button" id="btn-reset" class="btn btn-stop" onclick="resetTimer()" disabled>リセット</button>
    </div>
  </div>

  <!-- パスワード入力用モーダル -->
  <div class="modal-overlay" id="password-modal">
    <div class="modal-content">
      <div class="modal-title">管理者パスワード</div>
      <input type="password" id="admin-pass-input" class="modal-input" placeholder="パスワード入力" onkeydown="handleModalKeyDown(event)">
      <div class="error-msg" id="modal-error">パスワードが正しくありません</div>
      <div class="modal-btn-group">
        <button type="button" class="modal-btn modal-btn-cancel" onclick="closePasswordModal()">キャンセル</button>
        <button type="button" class="modal-btn modal-btn-submit" onclick="submitPassword()">解除</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // ★ Firebase設定 (ご自身のFirebaseキーを貼り付けてください)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDLScrTl21fqkamxUo16b6EDQ3OcFJwVws",
  authDomain: "fken-sync-timer-ver2.firebaseapp.com",
  databaseURL: "https://fken-sync-timer-ver2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fken-sync-timer-ver2",
  storageBucket: "fken-sync-timer-ver2.firebasestorage.app",
  messagingSenderId: "598969440249",
  appId: "1:598969440249:web:d2f22974e3d5eec8400f28",
  measurementId: "G-G2EDDQXRV5"
    };

    // Firebase 初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const timerRef = db.ref('timer');

    // 端末の時計とFirebaseサーバー時刻との差分（ミリ秒）を取得
    let serverTimeOffset = 0;
    db.ref('.info/serverTimeOffset').on('value', (snap) => {
      serverTimeOffset = snap.val() || 0;
    });

    // 補正された正確な現在時刻（ミリ秒）を返す関数
    function getServerTime() {
      return Date.now() + serverTimeOffset;
    }

    // 「fken」のSHA-256ハッシュ値
    const ADMIN_PASSWORD_HASH = "5f21d4b4f4a56adc19582e435d09be3b25387d37a27e5562166d9ac058628185";
    
    let isAdminUnlocked = false;
    let isFreeMode = false;
    let pendingAction = null;

    let timerLoopInterval = null;
    let localTimerState = {};
    let toastTimeout = null;

    // SHA-256 ハッシュ関数
    async function hashPassword(message) {
      const msgUint8 = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ============================================================
    // Firebase リアルタイム受信処理 (端末間で自動同期)
    // ============================================================
    timerRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      localTimerState = data;

      // 入力値の反映 (操作中でない場合のみ更新)
      if (document.activeElement !== document.getElementById('part1-min')) {
        document.getElementById('part1-min').value = data.part1Min ?? 0.5;
      }
      if (document.activeElement !== document.getElementById('part2-min')) {
        document.getElementById('part2-min').value = data.part2Min ?? 0.2;
      }

      // 開放モード状態の反映
      isFreeMode = !!data.isFreeMode;
      const freeBtn = document.getElementById('btn-free-toggle');
      if (isFreeMode) {
        document.body.classList.add('free-mode');
        freeBtn.innerText = "🔓 操作開放: ON";
        freeBtn.classList.add('active');
      } else {
        document.body.classList.remove('free-mode');
        freeBtn.innerText = "🔓 操作開放: OFF";
        freeBtn.classList.remove('active');
      }

      renderLocalUI();
    });

    // 画面ローカルのタイマー描画ループ (毎秒・ミリ秒を画面描画)
    if (!timerLoopInterval) {
      timerLoopInterval = setInterval(renderLocalUI, 100);
    }

    function renderLocalUI() {
      const state = localTimerState;
      if (!state.isRunning) {
        document.body.classList.remove('warning', 'danger', 'interval', 'pause-animation');
        document.getElementById('status').innerText = "準備中";
        document.getElementById('timer').innerText = "00:00";
        updateControlButtons(false, false);
        return;
      }

      if (state.isTransitioning) {
        document.body.classList.remove('warning', 'danger', 'pause-animation');
        document.body.classList.add('interval');
        const endLabel = (state.currentPart === 1) ? '演奏終了！' : '転換終了！';
        document.getElementById('status').innerText = endLabel;
        document.getElementById('timer').innerText = "NEXT...";
        updateControlButtons(false, true);
        return;
      }

      document.body.classList.remove('interval');
      
      let diffMs = 0;
      if (state.isPaused) {
        diffMs = state.remainingMs || 0;
      } else {
        // サーバー補正済み時刻（getServerTime）を使用してズレを解消
        diffMs = Math.max(0, (state.targetEndTime || 0) - getServerTime());
      }

      const diffSec = Math.ceil(diffMs / 1000);

      // 点滅スタイル
      document.body.classList.remove('danger', 'warning');
      if (diffSec <= 15 && diffSec > 0) {
        document.body.classList.add('danger');
      } else if (diffSec <= 30 && diffSec > 0) {
        document.body.classList.add('warning');
      }

      if (state.isPaused) {
        document.body.classList.add('pause-animation');
      } else {
        document.body.classList.remove('pause-animation');
      }

      // 時間テキスト表示
      const m = String(Math.floor(diffSec / 60)).padStart(2, '0');
      const s = String(diffSec % 60).padStart(2, '0');

      let label = (state.currentPart === 1) ? '演奏中' : '転換中';
      if (state.isPaused) label += '（一時停止）';

      document.getElementById('status').innerText = label;
      document.getElementById('timer').innerText = `${m}:${s}`;

      // 一時停止ボタンテキスト
      const pauseBtn = document.getElementById('btn-pause');
      if (pauseBtn) pauseBtn.innerText = state.isPaused ? "再開" : "一時停止";

      updateControlButtons(true, true);

      // カウント終了時（複数端末から重複発火しないようTransactionで処理）
      if (diffMs <= 0 && !state.isPaused && !state.isTransitioning) {
        triggerPartEndServer();
      }
    }

    // カウント終了・切り替え処理 (全端末で1回だけ安全に実行されるトランザクション)
    function triggerPartEndServer() {
      timerRef.transaction((current) => {
        if (!current || !current.isRunning || current.isTransitioning) return current;
        current.isTransitioning = true;
        return current;
      }, (error, committed, snapshot) => {
        if (committed) {
          setTimeout(() => {
            const data = snapshot.val();
            if (!data) return;

            const p1Ms = (data.part1Min || 0) * 60 * 1000;
            const p2Ms = (data.part2Min || 0) * 60 * 1000;

            let nextPart = (data.currentPart === 1) ? 2 : 1;
            if (nextPart === 2 && p2Ms <= 0) nextPart = 1;
            if (nextPart === 1 && p1Ms <= 0) nextPart = 2;

            const nextDuration = (nextPart === 1) ? p1Ms : p2Ms;

            timerRef.update({
              currentPart: nextPart,
              isTransitioning: false,
              targetEndTime: getServerTime() + nextDuration
            });
          }, 2000);
        }
      });
    }

    // ============================================================
    // ボタン操作（Firebaseへ状態を送信）
    // ============================================================
    function saveTimerSettings() {
      const p1Val = parseFloat(document.getElementById('part1-min').value) || 0;
      const p2Val = parseFloat(document.getElementById('part2-min').value) || 0;

      timerRef.update({
        part1Min: p1Val,
        part2Min: p2Val
      });

      showToast('設定した時間を保存しました');
    }

    function startTimer() {
      const p1Val = parseFloat(document.getElementById('part1-min').value) || 0;
      const p2Val = parseFloat(document.getElementById('part2-min').value) || 0;

      const p1Ms = p1Val * 60 * 1000;
      const p2Ms = p2Val * 60 * 1000;

      if (p1Ms <= 0 && p2Ms <= 0) {
        showToast("分数を入力してください");
        return;
      }

      const startPart = p1Ms > 0 ? 1 : 2;
      const duration = (startPart === 1) ? p1Ms : p2Ms;

      timerRef.update({
        part1Min: p1Val,
        part2Min: p2Val,
        isRunning: true,
        isPaused: false,
        isTransitioning: false,
        currentPart: startPart,
        targetEndTime: getServerTime() + duration,
        remainingMs: 0
      });
    }

    function togglePause() {
      if (!localTimerState.isRunning || localTimerState.isTransitioning) return;

      if (!localTimerState.isPaused) {
        const remainingMs = Math.max(0, localTimerState.targetEndTime - getServerTime());
        timerRef.update({
          isPaused: true,
          remainingMs: remainingMs
        });
      } else {
        const newEndTime = getServerTime() + (localTimerState.remainingMs || 0);
        timerRef.update({
          isPaused: false,
          targetEndTime: newEndTime
        });
      }
    }

    function skipPart() {
      if (!localTimerState.isRunning || localTimerState.isTransitioning) return;

      const p1Ms = (localTimerState.part1Min || 0) * 60 * 1000;
      const p2Ms = (localTimerState.part2Min || 0) * 60 * 1000;

      let nextPart = (localTimerState.currentPart === 1) ? 2 : 1;
      if (nextPart === 2 && p2Ms <= 0) nextPart = 1;
      if (nextPart === 1 && p1Ms <= 0) nextPart = 2;

      const duration = (nextPart === 1) ? p1Ms : p2Ms;

      timerRef.update({
        isRunning: true,
        isPaused: false,
        isTransitioning: false,
        currentPart: nextPart,
        targetEndTime: getServerTime() + duration
      });
    }

    function resetTimer() {
      timerRef.update({
        isRunning: false,
        isPaused: false,
        isTransitioning: false,
        targetEndTime: 0,
        remainingMs: 0
      });
    }

    // ============================================================
    // 管理者 / モーダル・認証処理
    // ============================================================
    function handleFreeButtonClick() {
      if (isFreeMode) {
        timerRef.update({ isFreeMode: false });
        showToast('操作制限を有効にしました');
      } else {
        openPasswordModal('free');
      }
    }

    function handleAdminButtonClick() {
      if (!isAdminUnlocked) {
        openPasswordModal('admin');
      } else {
        isAdminUnlocked = false;
        document.body.classList.remove('admin-mode');
        document.getElementById('btn-admin-toggle').innerText = "🔒 管理者";
        document.getElementById('btn-admin-toggle').classList.remove("unlocked");
      }
    }

    function openPasswordModal(action) {
      pendingAction = action;
      const modal = document.getElementById('password-modal');
      const input = document.getElementById('admin-pass-input');
      const errorMsg = document.getElementById('modal-error');
      
      input.value = '';
      input.classList.remove('error');
      errorMsg.classList.remove('active');
      modal.classList.add('active');
      
      setTimeout(() => input.focus(), 100);
    }

    function closePasswordModal() {
      document.getElementById('password-modal').classList.remove('active');
      pendingAction = null;
    }

    function handleModalKeyDown(e) {
      if (e.key === 'Enter') submitPassword();
    }

    async function submitPassword() {
      const input = document.getElementById('admin-pass-input');
      const errorMsg = document.getElementById('modal-error');

      const inputHash = await hashPassword(input.value);

      if (inputHash === ADMIN_PASSWORD_HASH) {
        if (pendingAction === 'admin') {
          isAdminUnlocked = true;
          document.body.classList.add('admin-mode');
          document.getElementById('btn-admin-toggle').innerText = "🔓 管理者解除中";
          document.getElementById('btn-admin-toggle').classList.add("unlocked");
        } else if (pendingAction === 'free') {
          timerRef.update({ isFreeMode: true });
          showToast('操作パネルを開放しました（全端末同期済み）');
        }
        closePasswordModal();
      } else {
        input.classList.add('error');
        errorMsg.classList.add('active');
        input.focus();
        input.select();
      }
    }

    function updateControlButtons(active, isRunning) {
      const pauseBtn = document.getElementById('btn-pause');
      const skipBtn = document.getElementById('btn-skip');
      const resetBtn = document.getElementById('btn-reset');

      if (pauseBtn) pauseBtn.disabled = !active;
      if (skipBtn) skipBtn.disabled = !active;
      if (resetBtn) resetBtn.disabled = !isRunning;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');

      if (toastTimeout !== null) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
