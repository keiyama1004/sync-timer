<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>連続タイマー</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding-top: 30px; background: #f4f4f9; }
    #status { font-size: 1.5rem; font-weight: bold; color: #555; margin-bottom: 10px; }
    #timer { font-size: 5rem; font-weight: bold; color: #333; margin: 10px 0 20px; }
    .input-group { background: #fff; padding: 20px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .input-row { margin: 10px 0; font-size: 1.1rem; }
    .input-row input { width: 70px; padding: 8px; font-size: 1rem; text-align: center; border: 1px solid #ccc; border-radius: 6px; }
    .btn-start { font-size: 1.2rem; padding: 12px 30px; border-radius: 8px; border: none; background: #28a745; color: white; font-weight: bold; cursor: pointer; }
    .btn-start:hover { background: #218838; }
  </style>
</head>
<body>

  <h1>連続タイマー</h1>
  <div id="status">準備中</div>
  <div id="timer">00:00</div>

  <div class="input-group">
    <div class="input-row">
      <label for="part1-min">Part 1:</label>
      <input type="number" id="part1-min" value="5" min="0" step="0.5"> 分
    </div>
    <div class="input-row">
      <label for="part2-min">Part 2:</label>
      <input type="number" id="part2-min" value="3" min="0" step="0.5"> 分
    </div>
    <br>
    <button class="btn-start" onclick="startContinuousTimer()">タイマー開始</button>
  </div>

  <script>
    let timerId = null;

    function startContinuousTimer() {
      // 既存のタイマーがあれば停止
      if (timerId) cancelAnimationFrame(timerId);

      const part1Min = parseFloat(document.getElementById('part1-min').value) || 0;
      const part2Min = parseFloat(document.getElementById('part2-min').value) || 0;

      const part1Ms = part1Min * 60 * 1000;
      const part2Ms = part2Min * 60 * 1000;

      if (part1Ms <= 0 && part2Ms <= 0) {
        alert("分数を入力してください。");
        return;
      }

      const now = Date.now();
      const part1EndTime = now + part1Ms;
      const part2EndTime = part1EndTime + part2Ms;

      runTimer(part1EndTime, part2EndTime, part1Ms > 0 ? 1 : 2);
    }

    function runTimer(part1EndTime, part2EndTime, currentPart) {
      function update() {
        const now = Date.now();
        const targetEndTime = (currentPart === 1) ? part1EndTime : part2EndTime;
        const diff = Math.max(0, Math.floor((targetEndTime - now) / 1000));

        const m = String(Math.floor(diff / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');

        document.getElementById('status').innerText = `Part ${currentPart} 実行中`;
        document.getElementById('timer').innerText = `${m}:${s}`;

        if (diff <= 0) {
          if (currentPart === 1 && part2EndTime > part1EndTime) {
            // Part 1 終了後、直ちに Part 2 へ切り替え
            runTimer(part1EndTime, part2EndTime, 2);
          } else {
            // すべて完了
            document.getElementById('status').innerText = "完了！";
            document.getElementById('timer').innerText = "終了！";
          }
        } else {
          timerId = requestAnimationFrame(() => setTimeout(update, 200));
        }
      }
      update();
    }
  </script>
</body>
</html>
